apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_control: true
  proxy_mode: http&stream
  stream_proxy:
    tcp:
      - addr: 9100
  control:
    ip: "0.0.0.0"
    port: 9090

deployment:
  admin:
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: "admin"
        key: edd1c9f034335f136f87ad84b625c8f1
        role: admin
  etcd:
    host:
      - "http://host.docker.internal:2379"
    prefix: "/apisix"
    timeout: 30
